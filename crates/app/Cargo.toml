[package]
name = "candy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
candy-dbc = { path = "../dbc" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "Request",
    "Response",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Storage",
    "Url",
    "UrlSearchParams",
    "Window",
    "console",
]
