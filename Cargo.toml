[workspace]
resolver = "3"
members = ["crates/dbc", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RephlexZero/candy"
authors = ["Jake Stewart"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
