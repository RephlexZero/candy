name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (engine)
        run: cargo clippy -p candy-dbc --all-targets -- -D warnings

      - name: Clippy (app, wasm)
        run: cargo clippy -p candy-app --target wasm32-unknown-unknown -- -D warnings

      - name: Tests
        run: cargo test -p candy-dbc
